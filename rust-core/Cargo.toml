[package]
name = "hypercar_core"
version = "0.1.0"
edition = "2021"
description = "HyperCar 核心层：本机自绘画面 → AirPlay 推流（宝马 ID8.5 等 CarPlay 车机）"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
bytes = "1"
jni = "0.21"
log = "0.4"
android_logger = "0.14"
once_cell = "1"
parking_lot = "0.12"

# 密码学：控制通道/音视频流 ChaCha20-Poly1305、未配对 AES-128-CTR、
# pair-verify X25519/Ed25519、pair-setup SRP-6a(SHA-512, 3072-bit)
chacha20poly1305 = "0.10"
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
num-bigint = "0.4"
num-traits = "0.2"
getrandom = "0.2"

uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 不要 panic = "abort"：abort 会把「某个 unwrap 踩空」直接变成整个进程消失
# （2026-10-23 20:30：连上 AirPlay 端口后 App 秒崩、内存日志全丢，无从定位）。
# 保持默认 unwind 后，tokio 任务内的 panic 由任务边界捕获，lib.rs 的看门狗把它
# 报成「引擎任务异常退出」；panic hook 再把 PANIC 行打到 logcat（tag HyperCar-Core）。
strip = true

